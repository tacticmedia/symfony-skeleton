framework:
    rate_limiter:
        magic_link_ip:
            policy: 'sliding_window'
            limit: 20
            interval: '1 hour'
        magic_link_email:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'

when@dev: &non_prod_rate_limiter
    framework:
        rate_limiter:
            magic_link_ip:
                policy: 'no_limit'
            magic_link_email:
                policy: 'no_limit'

when@test: *non_prod_rate_limiter

parameters:
    env(LOGIN_LINK_LIFETIME): '300'
    env(LOGIN_LINK_MAX_USES): '1'
    app.security.login_link_lifetime: "%env(int:LOGIN_LINK_LIFETIME)%"

security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        database_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_USER: ~
        ROLE_ADMIN:
            - ROLE_USER
            - ROLE_ALLOWED_TO_SWITCH
    firewalls:
        dev:
            # The dev toolbars and the screenshot review. access_control never runs for
            # a firewall with `security: false`, so no application route may match.
            pattern: ^/_(profiler|wdt|dev)/
            security: false
            stateless: true
            lazy: true
        main:
            lazy: true
            entry_point: App\Security\AuthenticationEntryPoint
            provider: database_user_provider
            user_checker: App\Security\UserChecker
            login_link:
                login_path: !php/const App\Controller\Auth\LoginController::ROUTE_LINK
                check_route: !php/const App\Controller\Auth\LoginController::ROUTE_LINK_CHECK
                check_post_only: true
                max_uses: "%env(int:LOGIN_LINK_MAX_USES)%"
                # Sizes the used-link store, so it must cover the longest link minted
                # anywhere ({@see App\Security\LoginLinkUrlFactory}).
                lifetime: !php/const App\Security\LoginLinkUrlFactory::EMAIL_LIFETIME
                success_handler: App\Security\LoginLinkSuccessHandler
                signature_properties: [ 'id', 'loginLinkSignatureHash' ]
            logout:
                path: !php/const App\Controller\Auth\LogoutController::ROUTE_LOGOUT
                target: !php/const App\Controller\Auth\LogoutController::ROUTE_BYE
                clear_site_data: '*'
                # logout_path() appends the stateless token; plain GET links keep working.
                enable_csrf: true
            switch_user: true

    # Controllers declare their access with #[IsGranted] ({@see App\Command\SecurityCheckAccessCommand}).
    access_control:

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

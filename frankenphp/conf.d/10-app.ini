expose_php = 0
date.timezone = UTC
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; The dropzone sends one photo per request, so the post ceiling only has to clear a
; single file plus multipart overhead. A request over post_max_size never reaches the
; kernel under FrankenPHP - PHP answers 200 with a warning page and Turbo drops it, so
; the browser refuses an oversized file before sending it
; ({@see assets/controllers/dropzone_controller.js}).
upload_max_filesize = 64M
post_max_size = 68M

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.enable_file_override = 1

; more data for Sentry
zend.exception_ignore_args = Off
